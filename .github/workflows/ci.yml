name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt flake8
      - name: Lint
        run: flake8 .
      - name: Unit and acceptance tests
        run: pytest -m "not simulation" -q
      - name: 100-run simulation tests against the planted effect
        run: pytest -m simulation -q
